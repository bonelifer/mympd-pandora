services:
  pandora:
    image: ghcr.io/bonelifer/mympd-pandora:latest
    user: "${PANDORA_UID:?Set PANDORA_UID}:${PANDORA_GID:?Set PANDORA_GID}"
    volumes:
      - type: bind
        source: "${PANDORA_CONFIG:?Set PANDORA_CONFIG}"
        target: /config/pydora.cfg
        read_only: true
        bind:
          create_host_path: false
    networks:
      - mpd
    restart: unless-stopped

networks:
  mpd:
    external: true
    name: "${MPD_NETWORK:-mpd}"
